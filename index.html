<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vision AI</title><style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080d1c;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    padding:18px;
    background:#111936;
    border-bottom:1px solid #29345e;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

h1{
    margin:0;
    font-size:22px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#777;
}

.dot.on{
    background:#20e070;
    box-shadow:0 0 10px #20e070;
}

main{
    max-width:1400px;
    margin:auto;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 330px;
    gap:20px;
}

.camera{
    position:relative;
    background:#000;
    border-radius:16px;
    overflow:hidden;
    border:1px solid #29345e;
}

video{
    width:100%;
    display:block;
    transform:scaleX(-1);
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:scaleX(-1);
    pointer-events:none;
}

.start{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.85);
    text-align:center;
    padding:20px;
}

.start.hidden{
    display:none;
}

button{
    border:0;
    padding:13px 18px;
    border-radius:10px;
    background:#536dfe;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#4058e8;
}

.panel{
    background:#111936;
    border:1px solid #29345e;
    border-radius:16px;
    padding:18px;
}

.panel h2{
    margin-top:0;
    font-size:18px;
}

.cards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card{
    background:#192244;
    padding:15px;
    border-radius:12px;
}

.number{
    font-size:30px;
    font-weight:bold;
    margin-top:6px;
}

.blue{color:#6d8aff}
.green{color:#20e070}
.yellow{color:#ffd95a}
.purple{color:#c084fc}

.controls{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.controls button{
    background:#192244;
    border:1px solid #344274;
}

.log{
    margin-top:15px;
    background:#050812;
    padding:12px;
    border-radius:10px;
    height:130px;
    overflow:auto;
    font:12px monospace;
    color:#aeb8db;
}

.objects{
    margin-top:20px;
}

.object{
    display:flex;
    justify-content:space-between;
    padding:9px;
    background:#192244;
    border-radius:8px;
    margin-bottom:6px;
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style></head><body><header>
    <h1>👁️ Vision AI</h1><div class="status">
    <span id="statusDot" class="dot"></span>
    <span id="status">Câmera desligada</span>
</div>

</header><main><div class="grid"><section><div class="camera"><video id="video" autoplay muted playsinline></video>

<canvas id="canvas"></canvas>

<div id="startScreen" class="start">

    <div>
        <h2>📷 Ativar câmera</h2>

        <p>
            Clique no botão abaixo e permita o acesso
            à câmera quando o navegador solicitar.
        </p>

        <button id="start">
            📷 Iniciar câmera
        </button>

        <p id="error"
           style="color:#ff8a8a;margin-top:15px">
        </p>
    </div>

</div>

</div><div class="controls"><button id="stop">
    ⏹ Parar
</button>

<button id="pause">
    ⏸ Pausar
</button>

</div><div id="log" class="log">
Sistema pronto.
</div></section><aside class="panel"><h2>📊 Detecção</h2><div class="cards"><div class="card">
    <small>👤 Pessoas</small>
    <div id="people" class="number blue">0</div>
</div><div class="card">
    <small>🙂 Rostos</small>
    <div id="faces" class="number green">0</div>
</div><div class="card">
    <small>✋ Mãos</small>
    <div id="hands" class="number yellow">0</div>
</div><div class="card">
    <small>📦 Objetos</small>
    <div id="objects" class="number purple">0</div>
</div></div><div class="objects"><h2>📦 Objetos encontrados</h2><div id="objectList">
    Nenhum objeto detectado.
</div></div><div style="margin-top:20px"><h2>🏃 Movimento</h2><div class="card">
    <div id="movement">
        Aguardando câmera...
    </div>
</div></div></aside></div></main><script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const start = document.getElementById("start");
const stop = document.getElementById("stop");
const pause = document.getElementById("pause");

const startScreen =
    document.getElementById("startScreen");

const status =
    document.getElementById("status");

const statusDot =
    document.getElementById("statusDot");

const errorBox =
    document.getElementById("error");

const logBox =
    document.getElementById("log");

let stream = null;
let paused = false;
let running = false;


/* =========================
   LOG
========================= */

function log(text){

    const time =
        new Date().toLocaleTimeString();

    logBox.innerHTML +=
        "["+time+"] "+text+"<br>";

    logBox.scrollTop =
        logBox.scrollHeight;
}


/* =========================
   VERIFICAR CÂMERA
========================= */

function checkCamera(){

    if(!navigator.mediaDevices){

        errorBox.textContent =
            "Seu navegador não disponibilizou acesso à câmera.";

        log("mediaDevices não disponível.");

        return false;
    }

    if(!navigator.mediaDevices.getUserMedia){

        errorBox.textContent =
            "Este navegador não suporta acesso à câmera.";

        return false;
    }

    return true;
}


/* =========================
   INICIAR CÂMERA
========================= */

async function startCamera(){

    errorBox.textContent = "";

    log("Solicitando permissão da câmera...");

    if(!checkCamera()) return;


    try{

        /*
        IMPORTANTE:
        getUserMedia precisa ser chamado
        diretamente após a ação do usuário.
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{
                        ideal:1280
                    },
                    height:{
                        ideal:720
                    }
                },

                audio:false
            });


        video.srcObject = stream;

        await video.play();


        running = true;
        paused = false;


        startScreen.classList.add("hidden");


        status.textContent =
            "Câmera funcionando";

        statusDot.classList.add("on");


        log("Permissão concedida.");

        log("Câmera iniciada.");

        resizeCanvas();


        /*
        Agora a câmera já funciona.
        A inteligência artificial será
        carregada separadamente.
        */

        loadAI();

    }
    catch(err){

        console.error(err);

        log(
            "Erro: "+err.name
        );


        if(err.name === "NotAllowedError"){

            errorBox.textContent =
                "A permissão da câmera foi negada. Autorize a câmera nas configurações do navegador.";

        }
        else if(err.name === "NotFoundError"){

            errorBox.textContent =
                "Nenhuma câmera foi encontrada.";

        }
        else if(err.name === "NotReadableError"){

            errorBox.textContent =
                "A câmera está sendo usada por outro aplicativo.";

        }
        else if(err.name === "SecurityError"){

            errorBox.textContent =
                "O navegador bloqueou a câmera por segurança. Abra o site usando HTTPS.";

        }
        else{

            errorBox.textContent =
                "Não foi possível iniciar a câmera: "
                + err.message;

        }

    }

}


/* =========================
   PARAR
========================= */

function stopCamera(){

    running = false;

    if(stream){

        stream.getTracks().forEach(
            track => track.stop()
        );

        stream = null;
    }


    video.srcObject = null;

    status.textContent =
        "Câmera desligada";

    statusDot.classList.remove("on");

    startScreen.classList.remove("hidden");

    document.getElementById("people").textContent="0";
    document.getElementById("faces").textContent="0";
    document.getElementById("hands").textContent="0";
    document.getElementById("objects").textContent="0";

    document.getElementById("movement").textContent =
        "Aguardando câmera...";

    log("Câmera desligada.");

}


/* =========================
   PAUSAR
========================= */

function togglePause(){

    paused = !paused;

    if(paused){

        pause.textContent =
            "▶ Continuar";

        log("Detecção pausada.");

    }
    else{

        pause.textContent =
            "⏸ Pausar";

        log("Detecção retomada.");

    }

}


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

    if(video.videoWidth === 0) return;

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}


/* =========================
   LOOP VISUAL
========================= */

function draw(){

    if(!running){

        requestAnimationFrame(draw);
        return;
    }

    if(!paused){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }

    requestAnimationFrame(draw);
}


/* =========================
   CARREGAR IA
========================= */

async function loadAI(){

    log("Câmera funcionando.");

    log("Preparando detector de IA...");

    /*
    Aqui a IA pode ser adicionada sem
    impedir o funcionamento da câmera.

    Primeiro vamos garantir que a câmera
    está funcionando corretamente.
    */

    try{

        const script =
            document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.js";

        script.onload = function(){

            log("Biblioteca de visão carregada.");

            status.textContent =
                "Câmera + IA pronta";

            startDetection();

        };

        script.onerror = function(){

            log(
                "Não foi possível carregar a IA."
            );

            status.textContent =
                "Câmera funcionando";

        };

        document.head.appendChild(script);

    }
    catch(err){

        console.error(err);

        log(
            "Erro ao carregar IA: "+
            err.message
        );

    }

}


/* =========================
   DETECÇÃO BÁSICA
========================= */

function startDetection(){

    log("Sistema de visão iniciado.");

    /*
    A câmera permanece funcionando mesmo
    se o modelo de IA não carregar.
    */

    detectionLoop();

}


function detectionLoop(){

    if(!running){

        requestAnimationFrame(
            detectionLoop
        );

        return;
    }


    if(!paused){

        /*
        Área reservada para os modelos
        de detecção.
        */

        document.getElementById(
            "movement"
        ).textContent =
            "🟢 Monitorando movimento";

    }


    requestAnimationFrame(
        detectionLoop
    );

}


/* =========================
   EVENTOS
========================= */

start.addEventListener(
    "click",
    startCamera
);

stop.addEventListener(
    "click",
    stopCamera
);

pause.addEventListener(
    "click",
    togglePause
);

video.addEventListener(
    "loadedmetadata",
    resizeCanvas
);

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   INICIAR LOOP
========================= */

draw();

</script></body>
</html>
