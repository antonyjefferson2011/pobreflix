<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pobreflix - Vingadores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1 class="logo">🎬 POBREFLIX</h1>
        <span class="movie-count" id="movieCount">0 filmes</span>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar filme..." class="search-input">
    </div>

    <div class="categories">
        <div class="category active" data-cat="all">TODOS</div>
        <div class="category" data-cat="acao">AÇÃO</div>
        <div class="category" data-cat="comedia">COMÉDIA</div>
        <div class="category" data-cat="drama">DRAMA</div>
        <div class="category" data-cat="ficcao">FICÇÃO</div>
    </div>

    <div id="filmesContainer" class="filmes-container"></div>

    <div id="playerModal" class="player-modal" style="display:none;">
        <div class="modal-content">
            <div class="close-btn" id="closePlayer">✕</div>
            <div class="video-container">
                <video id="videoPlayer" controls playsinline>
                    Seu navegador não suporta vídeo HTML5.
                </video>
            </div>
            <div class="video-info">
                <h3 id="videoTitle"></h3>
                <div class="error-msg" id="errorMsg" style="display:none;">
                    <p>❌ Erro ao carregar o vídeo!</p>
                    <button id="retryBtn" class="retry-btn">🔄 TENTAR NOVAMENTE</button>
                </div>
            </div>
        </div>
    </div>

    <button id="addMovieBtn" class="add-movie-btn" title="Adicionar filme">+</button>

    <div id="addMovieModal" class="add-movie-modal" style="display:none;">
        <div class="add-movie-content">
            <div class="close-btn" id="closeAddMovie">✕</div>
            <h2>Adicionar Filme</h2>
            <form id="addMovieForm">
                <input type="text" id="movieTitle" placeholder="Título do filme" required>
                <input type="text" id="movieCapa" placeholder="URL da capa (imagem)">
                <input type="text" id="movieVideo" placeholder="URL do vídeo" required>
                <select id="movieCategory">
                    <option value="acao">Ação</option>
                    <option value="comedia">Comédia</option>
                    <option value="drama">Drama</option>
                    <option value="ficcao">Ficção</option>
                </select>
                <button type="submit" class="submit-btn">ADICIONAR FILME</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
