<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Pessoas e Movimento</title>
    <!-- MediaPipe (biblioteca de visão computacional) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #e8e0d0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background: #111118;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 16px;
            color: #ffd700;
            font-family: 'Courier New', monospace;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #1a1a2e;
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Painel de informações */
        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 16px;
            padding: 16px;
            background: rgba(255, 215, 0, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }

        .info-item {
            text-align: center;
            padding: 8px;
        }

        .info-item .label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-item .value {
            font-size: 18px;
            font-weight: 600;
            color: #ffd700;
            margin-top: 2px;
        }

        .info-item .value.red {
            color: #ff4444;
        }
        .info-item .value.green {
            color: #44ff88;
        }
        .info-item .value.blue {
            color: #4488ff;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            margin-top: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            font-size: 13px;
        }

        .status-bar .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-bar .status-dot.on {
            background: #44ff88;
            box-shadow: 0 0 16px rgba(68, 255, 136, 0.3);
        }

        .status-bar .status-dot.off {
            background: #ff4444;
            box-shadow: 0 0 16px rgba(255, 68, 68, 0.3);
        }

        .btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ffb800);
            color: #0a0a0f;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .btn-danger {
            background: #ff4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #cc0000;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📷 DETECTOR DE PESSOAS</h1>

        <div class="video-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <!-- Painel de informações -->
        <div class="info-panel">
            <div class="info-item">
                <div class="label">Pessoas Detectadas</div>
                <div class="value blue" id="peopleCount">0</div>
            </div>
            <div class="info-item">
                <div class="label">Movimento</div>
                <div class="value green" id="movementStatus">Parado</div>
            </div>
            <div class="info-item">
                <div class="label">Intensidade</div>
                <div class="value" id="movementIntensity">0%</div>
            </div>
            <div class="info-item">
                <div class="label">Rostos</div>
                <div class="value" id="faceCount">0</div>
            </div>
        </div>

        <!-- Status -->
        <div class="status-bar">
            <span>
                <span class="status-dot off" id="statusDot"></span>
                <span id="statusText">Aguardando...</span>
            </span>
            <span id="fpsDisplay">0 FPS</span>
        </div>

        <!-- Controles -->
        <div class="controls">
            <button class="btn btn-primary" onclick="iniciarCamera()">▶️ Iniciar</button>
            <button class="btn btn-danger" onclick="pararCamera()">⏹️ Parar</button>
        </div>
    </div>

    <script>
        // ============================================
        // DETECTOR DE PESSOAS E MOVIMENTO
        // ============================================

        // ============================================
        // ELEMENTOS DOM
        // ============================================

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const peopleCount = document.getElementById('peopleCount');
        const movementStatus = document.getElementById('movementStatus');
        const movementIntensity = document.getElementById('movementIntensity');
        const faceCount = document.getElementById('faceCount');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const fpsDisplay = document.getElementById('fpsDisplay');

        // ============================================
        // ESTADO
        // ============================================

        let cameraAtiva = false;
        let frameAnterior = null;
        let movimentoAtual = 0;
        let pessoasDetectadas = 0;
        let rostosDetectados = 0;
        let ultimoMovimento = false;
        let fps = 0;
        let frameCount = 0;
        let lastFpsUpdate = Date.now();

        // ============================================
        // INICIAR CÂMERA
        // ============================================

        async function iniciarCamera() {
            try {
                // Acessa a câmera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    }
                });
                video.srcObject = stream;
                await video.play();

                // Ajusta o canvas
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                cameraAtiva = true;
                statusDot.className = 'status-dot on';
                statusText.textContent = '🔴 Analisando...';

                // Inicia a detecção
                iniciarDetectores();
                processarFrame();

            } catch (error) {
                console.error('Erro ao acessar câmera:', error);
                alert('Erro ao acessar a câmera. Verifique as permissões.');
            }
        }

        // ============================================
        // PARAR CÂMERA
        // ============================================

        function pararCamera() {
            cameraAtiva = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            statusDot.className = 'status-dot off';
            statusText.textContent = '⏹️ Parado';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            peopleCount.textContent = '0';
            faceCount.textContent = '0';
            movementStatus.textContent = 'Parado';
            movementIntensity.textContent = '0%';
        }

        // ============================================
        // DETECTOR DE ROSTOS (MediaPipe)
        // ============================================

        let faceDetection = null;

        function iniciarDetectores() {
            // Inicializa o MediaPipe Face Detection
            faceDetection = new FaceDetection({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
                }
            });

            faceDetection.setOptions({
                model: 'short',
                minDetectionConfidence: 0.5,
                selfieMode: true
            });

            faceDetection.onResults((results) => {
                rostosDetectados = results.detections ? results.detections.length : 0;
                faceCount.textContent = rostosDetectados;
            });
        }

        // ============================================
        // PROCESSAR FRAME (DETECÇÃO DE MOVIMENTO)
        // ============================================

        function processarFrame() {
            if (!cameraAtiva || !video.srcObject) {
                requestAnimationFrame(processarFrame);
                return;
            }

            // Desenha o frame no canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Pega os pixels do canvas
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // ============================================
            // 1. DETECÇÃO DE MOVIMENTO (por frame)
            // ============================================

            if (frameAnterior) {
                let diferencaTotal = 0;
                const totalPixels = canvas.width * canvas.height;

                // Compara os pixels com o frame anterior
                for (let i = 0; i < data.length; i += 8) {
                    const r = Math.abs(data[i] - frameAnterior[i]);
                    const g = Math.abs(data[i + 1] - frameAnterior[i + 1]);
                    const b = Math.abs(data[i + 2] - frameAnterior[i + 2]);
                    diferencaTotal += (r + g + b) / 3;
                }

                // Calcula a intensidade do movimento (0-100%)
                const intensidade = Math.min(100, (diferencaTotal / totalPixels) * 3);
                movimentoAtual = intensidade;

                // Determina se há movimento significativo
                const haMovimento = intensidade > 8;

                // ============================================
                // 2. DETECÇÃO DE PESSOAS (por tom de pele + movimento)
                // ============================================

                if (haMovimento) {
                    // Escaneia a imagem procurando por tons de pele
                    let pixelsPele = 0;
                    const pixelsPorLinha = canvas.width * 4;

                    for (let y = 0; y < canvas.height; y += 3) {
                        for (let x = 0; x < canvas.width; x += 3) {
                            const i = (y * canvas.width + x) * 4;
                            const r = data[i];
                            const g = data[i + 1];
                            const b = data[i + 2];

                            // Detecção de tom de pele (simplificada)
                            if (r > 60 && g > 40 && b > 40 &&
                                r > g && r > b &&
                                Math.abs(r - g) > 15 &&
                                r < 220) {
                                pixelsPele++;
                            }
                        }
                    }

                    // Se tiver muitos pixels de pele, provavelmente é uma pessoa
                    const porcentagemPele = (pixelsPele / (canvas.width * canvas.height)) * 100;
                    pessoasDetectadas = porcentagemPele > 0.5 ? Math.round(porcentagemPele / 5) + 1 : 0;

                    // Exibe no painel
                    if (pessoasDetectadas > 0) {
                        peopleCount.textContent = pessoasDetectadas;
                        movementStatus.textContent = '🚶 Movimento';
                        movementStatus.style.color = '#ffd700';
                    } else {
                        peopleCount.textContent = '0';
                        movementStatus.textContent = '🔴 Parado';
                        movementStatus.style.color = '#888';
                    }

                    // Mostra a intensidade
                    movementIntensity.textContent = Math.round(intensidade) + '%';
                    movementIntensity.style.color = intensidade > 40 ? '#ff4444' : intensidade > 20 ? '#ffa500' : '#44ff88';

                    // ============================================
                    // 3. DESENHAR A DETECÇÃO NO CANVAS
                    // ============================================

                    // Desenha um retângulo onde há movimento
                    if (intensidade > 15) {
                        const tamanho = Math.min(canvas.width, canvas.height) * 0.6;
                        const x = (canvas.width - tamanho) / 2;
                        const y = (canvas.height - tamanho) / 2;

                        ctx.strokeStyle = intensidade > 40 ?
                            'rgba(255, 68, 68, 0.6)' :
                            intensidade > 25 ?
                            'rgba(255, 165, 0, 0.6)' :
                            'rgba(68, 255, 136, 0.6)';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(x, y, tamanho, tamanho);

                        // Texto com informações
                        ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
                        ctx.font = '16px monospace';
                        ctx.fillText(`👤 ${pessoasDetectadas} pessoa(s)`, x + 10, y + 30);
                        ctx.fillText(`📊 ${Math.round(intensidade)}% movimento`, x + 10, y + 55);

                        // Desenha pontos de movimento
                        for (let i = 0; i < Math.min(Math.round(intensidade / 10), 20); i++) {
                            const px = x + 20 + Math.random() * (tamanho - 40);
                            const py = y + 20 + Math.random() * (tamanho - 40);
                            const size = 2 + Math.random() * 4;
                            ctx.fillStyle = intensidade > 40 ?
                                `rgba(255, 68, 68, ${0.3 + Math.random() * 0.5})` :
                                `rgba(255, 215, 0, ${0.3 + Math.random() * 0.5})`;
                            ctx.beginPath();
                            ctx.arc(px, py, size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // Detecção de rosto com MediaPipe (em paralelo)
                    try {
                        faceDetection.send({ image: video });
                    } catch (e) {
                        // MediaPipe pode falhar em alguns frames
                    }

                } else {
                    // Sem movimento
                    pessoasDetectadas = 0;
                    peopleCount.textContent = '0';
                    movementStatus.textContent = '🟢 Parado';
                    movementStatus.style.color = '#888';
                    movementIntensity.textContent = '0%';
                    movementIntensity.style.color = '#44ff88';
                    faceCount.textContent = '0';
                }

                // Guarda o frame para a próxima comparação
                frameAnterior = new Uint8Array(data);

            } else {
                // Primeiro frame: apenas salva
                frameAnterior = new Uint8Array(data);
                peopleCount.textContent = '0';
                movementStatus.textContent = '🔄 Aguardando...';
                movementIntensity.textContent = '0%';
            }

            // ============================================
            // 4. FPS
            // ============================================

            frameCount++;
            const now = Date.now();
            if (now - lastFpsUpdate > 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsUpdate = now;
                fpsDisplay.textContent = `${fps} FPS`;
            }

            // ============================================
            // 5. PRÓXIMO FRAME
            // ============================================

            requestAnimationFrame(processarFrame);
        }

        // ============================================
        // INICIAR AUTOMATICAMENTE?
        // ============================================

        // Descomente a linha abaixo para iniciar automaticamente
        // iniciarCamera();

        console.log('📷 Detector de Pessoas e Movimento carregado!');
        console.log('🔴 Clique em "Iniciar" para começar.');
    </script>

</body>
</html>
