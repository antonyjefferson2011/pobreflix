<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sidebar">

    <h2>JARVIS</h2>

    <button>Home</button>
    <button>Mapa</button>
    <button>Clima</button>
    <button>Notas</button>
    <button>Config</button>

  </div>

  <div class="main">

    <div class="topbar">
      <span>Sistema Online</span>
    </div>

    <div class="chat" id="chat">

      <div class="message jarvis">
        Sistema iniciado.
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="input"
        placeholder="Digite um comando..."
      >

      <button onclick="sendMessage()">
        Enviar
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
