<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Captura de Localização</title>
</head>
<body>
  <h2>Capturando sua localização...</h2>
  <p id="aviso">Por favor, permita o acesso à sua localização.</p>

  <script>
    // Cole aqui a URL que você copiou do Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBAh2SlMTZSa11bZHUMw3Je03i4OXf5vVMYIKbijbwNDCexfdQ56F5IrWkFBSXBtEz/exec";

    function enviarLocalizacao() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const dados = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };

            // Envia os dados para o Apps Script
            fetch(SCRIPT_URL, {
              method: "POST",
              mode: "no-cors", // Necessário para contornar problemas de CORS no Apps Script
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(dados)
            })
            .then(() => {
              document.getElementById("aviso").innerText = "✅ Localização enviada com sucesso!";
            })
            .catch(error => {
              document.getElementById("aviso").innerText = "Erro ao enviar: " + error;
            });
          },
          function(error) {
            document.getElementById("aviso").innerText = "Erro ao obter localização: " + error.message;
          }
        );
      } else {
        document.getElementById("aviso").innerText = "Geolocalização não é suportada por este navegador.";
      }
    }

    // Chama a função assim que a página carregar
    window.onload = enviarLocalizacao;
  </script>
</body>
</html>
